services:
  - type: web
    name: therapist-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health

    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false   # Get this from Cloudflare Turnstile dashboard
      - key: SPRING_DATASOURCE_URL
        sync: false   # PostgreSQL JDBC URL, e.g. jdbc:postgresql://host:5432/db
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
