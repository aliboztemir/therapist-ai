spring:
  application:
    name: therapist-ai

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.7

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: 8080
  servlet:
    session:
      persistent: false