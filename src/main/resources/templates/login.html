<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>TherapistAI — Sign In</title>
    <link rel="icon" type="image/png" href="/therapist-ai-home-page.png"/>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f8fafc, #e5e7eb);
            color: #111827;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            padding: 40px 36px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        img {
            width: 80px;
            border-radius: 12px;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 24px;
            margin: 0 0 6px;
        }

        .subtitle {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .alert {
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 18px;
            text-align: left;
        }

        .alert-error {
            background: #fee2e2;
            color: #991b1b;
        }

        .alert-success {
            background: #d1fae5;
            color: #065f46;
        }

        .alert-info {
            background: #dbeafe;
            color: #1e40af;
        }

        .form-group {
            text-align: left;
            margin-bottom: 16px;
        }

        label {
            font-size: 13px;
            font-weight: 600;
            color: #374151;
            display: block;
            margin-bottom: 6px;
        }

        input[type=text], input[type=password] {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.15s;
        }

        input:focus {
            border-color: #2563eb;
        }

        button[type=submit] {
            width: 100%;
            padding: 11px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            cursor: pointer;
            margin-top: 6px;
            transition: background 0.15s;
        }

        button[type=submit]:hover {
            background: #1d4ed8;
        }

        .footer {
            margin-top: 20px;
            font-size: 13px;
            color: #6b7280;
        }

        .footer a {
            color: #2563eb;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div class="card">
    <img src="/therapist-ai-home-page.png" alt="TherapistAI"/>
    <h1>TherapistAI</h1>
    <p class="subtitle">Sign in to continue</p>
    <div th:if="${param.error}" class="alert alert-error">Invalid username/email or password.</div>
    <div th:if="${param.logout}" class="alert alert-info">You have been signed out.</div>
    <div th:if="${param.registered}" class="alert alert-success">Account created — please sign in.</div>
    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label for="username">Username or Email</label>
            <input type="text" id="username" name="username" autocomplete="username"
                   maxlength="254" required autofocus/>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required/>
        </div>
        <button type="submit">Sign in</button>
    </form>
    <div class="footer">
        Don't have an account? <a href="/register">Create one</a>
    </div>
</div>
</body>
</html>
