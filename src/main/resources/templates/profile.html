<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - TherapistAI</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            margin: 0;
            padding: 40px;
            color: #111827;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .back-link {
            color: #2563eb;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .08);
        }

        h1,
        h2 {
            margin-top: 0;
        }

        h1 {
            margin-bottom: 0;
        }

        h2 {
            font-size: 20px;
            margin-bottom: 18px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
        }

        input,
        select {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, .15);
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background: #1d4ed8;
        }

        .success {
            background: #dcfce7;
            color: #166534;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 16px;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 16px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .readonly {
            background: #f3f4f6;
            color: #6b7280;
        }

        .hint {
            color: #6b7280;
            font-size: 12px;
            margin-top: 4px;
        }

        @media (max-width: 768px) {
            body {
                padding: 20px;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .page-header {
                align-items: flex-start;
                flex-direction: column;
                gap: 8px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="page-header">
        <h1>My Profile</h1>
        <a class="back-link" th:href="@{/}">← Back to chat</a>
    </div>

    <div th:if="${profileUpdated}" class="success">
        Profile updated successfully.
    </div>

    <div th:if="${profileError}" class="error" th:text="${profileError}">
        Profile update failed.
    </div>

    <div class="card">

        <h2>Profile Information</h2>

        <form method="post" th:action="@{/profile}">
            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}"/>

            <div class="grid">

                <div class="form-group">
                    <label for="username">Username</label>
                    <input
                            id="username"
                            type="text"
                            th:value="${profile.username}"
                            readonly
                            class="readonly">
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input
                            id="email"
                            type="email"
                            th:value="${profile.email}"
                            readonly
                            class="readonly">
                </div>

                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input
                            id="fullName"
                            type="text"
                            name="fullName"
                            required
                            maxlength="100"
                            th:value="${profile.fullName}">
                </div>

                <div class="form-group">
                    <label for="preferredName">Preferred Name</label>
                    <input
                            id="preferredName"
                            type="text"
                            name="preferredName"
                            maxlength="100"
                            th:value="${profile.preferredName}">
                </div>

                <div class="form-group">
                    <label for="birthDate">Birth Date</label>
                    <input
                            id="birthDate"
                            type="date"
                            name="birthDate"
                            th:value="${profile.birthDate}">
                </div>

                <div class="form-group">
                    <label for="gender">Gender</label>
                    <input
                            id="gender"
                            type="text"
                            name="gender"
                            maxlength="30"
                            th:value="${profile.gender}">
                </div>

                <div class="form-group">
                    <label for="country">Country</label>
                    <input
                            id="country"
                            type="text"
                            name="country"
                            maxlength="100"
                            th:value="${profile.country}">
                </div>

                <div class="form-group">
                    <label for="city">City</label>
                    <input
                            id="city"
                            type="text"
                            name="city"
                            maxlength="100"
                            th:value="${profile.city}">
                </div>

                <div class="form-group">
                    <label for="preferredLanguage">Preferred Language</label>
                    <input
                            id="preferredLanguage"
                            type="text"
                            name="preferredLanguage"
                            maxlength="10"
                            placeholder="tr, en, es"
                            th:value="${profile.preferredLanguage}">
                    <div class="hint">Example: tr, en, es</div>
                </div>

                <div class="form-group">
                    <label for="timezone">Timezone</label>
                    <input
                            id="timezone"
                            type="text"
                            name="timezone"
                            maxlength="80"
                            placeholder="Europe/Madrid"
                            th:value="${profile.timezone}">
                    <div class="hint">Example: Europe/Madrid</div>
                </div>

            </div>

            <button type="submit">
                Save Profile
            </button>

        </form>

    </div>

    <div th:if="${passwordUpdated}" class="success">
        Password updated successfully.
    </div>

    <div th:if="${passwordError}" class="error" th:text="${passwordError}">
        Password update failed.
    </div>

    <div class="card">

        <h2>Change Password</h2>

        <form method="post" th:action="@{/profile/password}">
            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}"/>

            <div class="form-group">
                <label for="currentPassword">Current Password</label>
                <input
                        id="currentPassword"
                        type="password"
                        name="currentPassword"
                        autocomplete="current-password"
                        required>
            </div>

            <div class="form-group">
                <label for="newPassword">New Password</label>
                <input
                        id="newPassword"
                        type="password"
                        name="newPassword"
                        autocomplete="new-password"
                        minlength="8"
                        maxlength="72"
                        required>
            </div>

            <div class="form-group">
                <label for="confirmNewPassword">Confirm New Password</label>
                <input
                        id="confirmNewPassword"
                        type="password"
                        name="confirmNewPassword"
                        autocomplete="new-password"
                        required>
            </div>

            <button type="submit">
                Change Password
            </button>

        </form>

    </div>

</div>

</body>
</html>
